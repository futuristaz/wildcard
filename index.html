<!DOCTYPE html>
<html lang="lt">

<head>
  <meta charset="utf-8">
  <title>Wildcard – Balsavimo rezultatai</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --border: #1f2933;
      --row-hover: #020617;
      --up: #22c55e;
      --down: #ef4444;
      --gold: #facc15;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #020617, #0f172a);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 1000px;
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      padding: 28px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    h2 {
      margin: 0;
      font-size: 1.6rem;
    }

    .meta {
      font-size: 0.9rem;
      color: var(--muted);
      text-align: right;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    thead th {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--muted);
      padding: 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    tbody tr:hover {
      background: var(--row-hover);
    }

    td {
      padding: 14px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .participant {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .participant img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
    }

    .votes {
      font-weight: 500;
    }

    .votes small {
      display: block;
      font-size: 0.75rem;
    }

    .delta {
      display: inline-block;
      transition: opacity 0.6s ease;
    }

    .delta.up {
      color: var(--up);
    }

    .delta.down {
      color: var(--down);
    }

    .delta.fade-out {
      opacity: 0;
    }

    .gap {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .percentage {
      min-width: 140px;
    }

    .bar {
      height: 10px;
      background: #020617;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #60a5fa);
      transition: width 0.6s ease;
    }

    .crown {
      font-size: 1rem;
      margin-left: 4px;
      color: var(--gold);
    }

    .last-updated {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .top1 {
      background: rgba(250, 204, 21, 0.2);
    }

    .top2 {
      background: rgba(192, 192, 192, 0.2);
    }

    .top3 {
      background: rgba(205, 127, 50, 0.2);
    }

    canvas {
      background: var(--card);
      border-radius: 8px;
      margin-top: 24px;
      margin-bottom: 16px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="header">
      <div>
        <h2>Balsavimo rezultatai</h2>
        Atnaujinama po <strong><span id="countdown">10</span>s</strong>
        <div class="last-updated" id="lastUpdated"></div>
      </div>
      <div class="meta">
        Viso balsų: <strong id="totalVotes">–</strong>
        <span id="totalDelta"></span>
      </div>
    </div>

    <table id="tbl"></table>
    <canvas id="voteChart" height="150"></canvas>
  </div>

  <script>
    const REFRESH_INTERVAL = 10;
    let remaining = REFRESH_INTERVAL;
    let timer;
    let lastSnapshot = null;
    let voteHistory = {}; // stores unlimited vote history
    let voteChart;
    let choiceColorMap = {}; // persistent color mapping for choices
    const datasetColors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA502', '#B86BDF'];

    function cleanName(name) {
      return name.replace(/\s*\/\/\s*/g, " – ").replace(/–\s*$/, "").trim();
    }

    function formatDelta(d) {
      if (!d) return "";
      const cls = d > 0 ? "up" : "down";
      const sign = d > 0 ? "+" : "";
      return `<span class="delta ${cls}">(${sign}${d})</span>`;
    }

    function fadeOutDeltas() {
      setTimeout(() => {
        document.querySelectorAll(".delta").forEach(d => d.classList.add("fade-out"));
      }, 2000);
    }

    function formatGap(gap) {
      return gap === 0 ? "" : `<span class="gap">−${gap.toLocaleString()}</span>`;
    }

    function getProjectedWinner(sorted) {
      if (!lastSnapshot) return null;
      const projections = sorted.map(c => {
        const prev = lastSnapshot.find(p => p.id === c.id);
        const delta = prev ? c.votes - prev.votes : 0;
        return { id: c.id, name: c.name, projected: c.votes + delta };
      });
      projections.sort((a, b) => b.projected - a.projected);
      return projections[0];
    }

    function updateChart(sorted) {
      // Update vote history
      sorted.forEach(c => {
        if (!voteHistory[c.id]) voteHistory[c.id] = [];
        voteHistory[c.id].push(c.votes); // unlimited history

        // Assign consistent color to each choice
        if (!choiceColorMap[c.id]) {
          choiceColorMap[c.id] = datasetColors[Object.keys(choiceColorMap).length % datasetColors.length];
        }
      });

      // Chart.js datasets
      const labels = voteHistory[sorted[0].id].map((_, i) => i + 1);
      const datasets = sorted.map((c) => ({
        label: cleanName(c.name),
        data: voteHistory[c.id],
        borderColor: choiceColorMap[c.id],
        fill: false,
        tension: 0.2
      }));

      if (!voteChart) {
        const ctx = document.getElementById('voteChart').getContext('2d');
        voteChart = new Chart(ctx, {
          type: 'line',
          data: { labels, datasets },
          options: {
            responsive: true,
            plugins: { legend: { position: 'top', labels: { color: '#e5e7eb' } } },
            scales: {
              x: { ticks: { color: '#9ca3af' }, title: { display: false, text: 'Intervalai', color: '#9ca3af' } },
              y: { ticks: { color: '#9ca3af' }, beginAtZero: true }
            }
          }
        });
      } else {
        voteChart.data.labels = labels;
        voteChart.data.datasets = datasets;
        voteChart.update();
      }
    }

    function render(data) {
      const table = document.getElementById("tbl");
      const total = data.choices.reduce((s, c) => s + c.votes, 0);
      const prevMap = lastSnapshot ? Object.fromEntries(lastSnapshot.map(c => [c.id, c.votes])) : {};
      const prevTotal = lastSnapshot ? Object.values(prevMap).reduce((a, b) => a + b, 0) : null;

      document.getElementById("totalVotes").textContent = total.toLocaleString();
      document.getElementById("totalDelta").innerHTML = prevTotal === null ? "" : formatDelta(total - prevTotal);

      const sorted = [...data.choices].sort((a, b) => b.votes - a.votes);
      const leaderVotes = sorted[0].votes;

      // Update chart
      updateChart(sorted);

      // Build table
      table.innerHTML = `
        <thead>
          <tr>
            <th>Dalyvis</th>
            <th>Balsai</th>
            <th>Skirtumas <br>nuo lyderio</th>
            <th>%</th>
          </tr>
        </thead>
        <tbody></tbody>
      `;
      const tbody = table.querySelector("tbody");

      sorted.forEach((c, i) => {
        const delta = prevMap[c.id] !== undefined ? formatDelta(c.votes - prevMap[c.id]) : "";
        const gap = i === 0 ? "" : formatGap(leaderVotes - c.votes);
        const crown = i === 0 ? '<span class="crown">👑</span>' : "";

        const row = document.createElement("tr");
        if (i === 0) row.classList.add("top1");
        else if (i === 1) row.classList.add("top2");
        else if (i === 2) row.classList.add("top3");

        row.innerHTML = `
          <td>
            <div class="participant">
              <img src="${c.image}" alt="${c.name}">
              ${cleanName(c.name)} ${crown}
            </div>
          </td>
          <td class="votes">
            ${c.votes.toLocaleString()}
            <small>${delta}</small>
          </td>
          <td>${gap}</td>
          <td class="percentage">
            ${c.percentage}%
            <div class="bar">
              <div class="bar-fill" style="width:${c.percentage}%"></div>
            </div>
          </td>
        `;
        tbody.appendChild(row);
      });

      lastSnapshot = sorted.map(c => ({ id: c.id, votes: c.votes }));
      fadeOutDeltas();
      document.getElementById("lastUpdated").textContent = "Paskutinį kartą atnaujinta: " + new Date().toLocaleTimeString();
    }

    function load() {
      fetch("https://www.lrt.lt/api/v1/daily-question/2417?t=" + Date.now(), { cache: "no-store" })
        .then(r => r.json())
        .then(data => {
          render(data);
          resetTimer();
        })
        .catch(err => console.error(err));
    }
    load();
  </script>
</body>

</html>
